<meta charset="utf-8">
<title>협업 브리지 자체 테스트</title>
<style>
  body{font:13px/1.6 ui-monospace,Consolas,monospace;background:#0f1116;color:#e9eaf0;padding:20px;}
  .pass{color:#5cc185;} .fail{color:#f0846a;font-weight:700;} h1{font-size:15px;}
  b{color:#7d97ff;}
</style>
<h1>협업 브리지 자체 테스트</h1>
<pre id="out"></pre>
<script type="importmap">
{ "imports": { "yjs": "https://esm.sh/yjs@13" } }
</script>
<script type="module">
import { Y } from './collab/deps.js';
import { buildProject, readProject, reconcile, applyTextDiff, normalizeLineBreaks, repairTextLineBreaks } from './collab/ydoc.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const log = (m, cls) => { out.innerHTML += (cls ? `<span class="${cls}">${m}</span>` : m) + '\n'; };
const ok = (name, cond) => { if (cond){pass++; log('PASS  ' + name,'pass');} else {fail++; log('FAIL  ' + name,'fail');} };
const clone = (x) => JSON.parse(JSON.stringify(x));

// 실제 헤더(23열) 축약 없이 사용
const HEADERS = ["상위지역ID(부모ID)","지역ID","지역명","인접 지역","종류 코드","스크립트(내용)","주사위 목표치","성공 스크립트","실패 스크립트","키아이템 필요 여부","키아이템 ID","파밍 아이템 ID","파밍 아이템 수","파밍 골드","파밍 경험치","지역거래 시, 교단원이 낼 아이템ID","지역거래 시, 교단원이 낼 골드 상한가","최초 탐사 여부","최초 탐사가 아닐 시 실패 스크립트","비고","종족 전용","종족이 아닐 때 스크립트","개방 조건"];
const SCRIPT_COL = HEADERS.indexOf('스크립트(내용)');
const FLAG_COL = HEADERS.indexOf('키아이템 필요 여부');

function mkRow(id, name, script) {
  const r = new Array(HEADERS.length).fill(null);
  r[1] = id; r[2] = name; r[SCRIPT_COL] = script; r[9] = 'N';
  return r;
}
function sampleData() {
  return {
    __buildStamp: 'test-1',
    toolTitle: '빛의왕국 탐사맵',
    sheet1: { headers: HEADERS.slice(), rows: [
      mkRow('LUM_MAIN', '본당', '거대한 아치 천장.'),
      mkRow('LUM_BELL', '종탑', '나선계단 입구.'),
    ]},
    items: { SWORD: { name: '검', desc: '낡은 검' } },
    cellColors: { LUM_MAIN: 'purple' },
    tagColors: { hot: '#f00' },   // 개인 설정 -> 공유되면 안 됨
  };
}

try {
  // ---- 1. 라운드트립: build -> read == 원본(개인키 제외) ----
  const D = sampleData();
  const docA = new Y.Doc();
  const built = buildProject(docA, clone(D), 'init');
  ok('최초 빌드 수행됨', built === true);
  const read = readProject(docA);
  const expected = clone(D); delete expected.tagColors; // 개인키 제외 기대
  ok('라운드트립 일치(개인키 제외)', JSON.stringify(read) === JSON.stringify(expected));
  ok('개인 설정 tagColors는 공유 문서에서 제외됨', !('tagColors' in read));

  // ---- 2. 두 번째 클라이언트는 "빌드"가 아니라 "로드"해야 한다 ----
  const docB = new Y.Doc();
  Y.applyUpdate(docB, Y.encodeStateAsUpdate(docA));           // 이력 공유 로드
  const builtB = buildProject(docB, clone(D), 'init');        // 이미 있으니 no-op이어야
  ok('이미 로드된 문서는 재빌드 안 함', builtB === false);
  ok('A/B 초기 상태 동일', JSON.stringify(readProject(docA)) === JSON.stringify(readProject(docB)));

  // ---- 3. 로컬 편집 재조정: 평범한 셀 + 텍스트 셀 ----
  {
    const cur = readProject(docA); const shadow = clone(cur);
    cur.sheet1.rows[0][FLAG_COL] = 'Y';                       // 플래그 변경
    cur.sheet1.rows[1][SCRIPT_COL] = '나선계단 입구, 쇠 냄새.'; // 텍스트 변경
    cur.toolTitle = '빛의왕국 탐사맵 v2';
    reconcile(docA, cur, shadow, 'app');
    const back = readProject(docA);
    ok('평범한 셀 편집 반영', back.sheet1.rows[0][FLAG_COL] === 'Y');
    ok('텍스트 셀 편집 반영', back.sheet1.rows[1][SCRIPT_COL] === '나선계단 입구, 쇠 냄새.');
    ok('최상위 값 편집 반영', back.toolTitle === '빛의왕국 탐사맵 v2');
    // docB도 최신으로 맞춰둠
    Y.applyUpdate(docB, Y.encodeStateAsUpdate(docA, Y.encodeStateVector(docB)), 'remote');
    ok('편집이 B로 전파됨', readProject(docB).toolTitle === '빛의왕국 탐사맵 v2');
  }

  // ---- 4. 핵심: 같은 텍스트 필드 동시 편집 -> 무손실 병합 ----
  {
    const svA0 = Y.encodeStateVector(docA);
    const svB0 = Y.encodeStateVector(docB);

    // A: LUM_MAIN 스크립트 앞에 "[A] " 추가
    const dA = readProject(docA); const sA = clone(dA);
    dA.sheet1.rows[0][SCRIPT_COL] = '[A] ' + dA.sheet1.rows[0][SCRIPT_COL];
    reconcile(docA, dA, sA, 'app');

    // B: 같은 셀 뒤에 " [B]" 추가 (동시)
    const dB = readProject(docB); const sB = clone(dB);
    dB.sheet1.rows[0][SCRIPT_COL] = dB.sheet1.rows[0][SCRIPT_COL] + ' [B]';
    reconcile(docB, dB, sB, 'app');

    // 서로 diff만 교환
    Y.applyUpdate(docA, Y.encodeStateAsUpdate(docB, svA0), 'remote');
    Y.applyUpdate(docB, Y.encodeStateAsUpdate(docA, svB0), 'remote');

    const a = readProject(docA).sheet1.rows[0][SCRIPT_COL];
    const b = readProject(docB).sheet1.rows[0][SCRIPT_COL];
    log('  A 결과: ' + JSON.stringify(a));
    log('  B 결과: ' + JSON.stringify(b));
    ok('동시 편집 수렴(A===B)', a === b);
    ok('A의 편집 보존', a.includes('[A]'));
    ok('B의 편집 보존', a.includes('[B]'));
    ok('원문 유실 없음', a.includes('거대한 아치 천장'));
  }

  // ---- 5. 서로 다른 행 동시 편집 -> 둘 다 반영 ----
  {
    const svA0 = Y.encodeStateVector(docA);
    const svB0 = Y.encodeStateVector(docB);
    const dA = readProject(docA); const sA = clone(dA);
    dA.sheet1.rows[0][2] = '본당(수정A)';                  // A는 0행 지역명
    reconcile(docA, dA, sA, 'app');
    const dB = readProject(docB); const sB = clone(dB);
    dB.sheet1.rows[1][2] = '종탑(수정B)';                  // B는 1행 지역명
    reconcile(docB, dB, sB, 'app');
    Y.applyUpdate(docA, Y.encodeStateAsUpdate(docB, svA0), 'remote');
    Y.applyUpdate(docB, Y.encodeStateAsUpdate(docA, svB0), 'remote');
    const r = readProject(docA).sheet1.rows;
    ok('다른 행 동시 편집 둘 다 반영', r[0][2] === '본당(수정A)' && r[1][2] === '종탑(수정B)');
    ok('A===B 수렴', JSON.stringify(readProject(docA)) === JSON.stringify(readProject(docB)));
  }

  // ---- 6. 보호 키(weather)는 incoming data에 없어도 삭제되지 않음(옛 클라이언트발 유실 방지) ----
  {
    const docW = new Y.Doc();
    const base = sampleData();
    base.weather = { headers:['내용','비고'], rows:[['맑음','메모1']] };  // 보호 키
    base.tempSection = { x: 1 };                                          // 비보호 최상위 키
    buildProject(docW, clone(base), 'init');
    ok('weather 초기 존재', !!readProject(docW).weather);
    ok('tempSection 초기 존재', !!readProject(docW).tempSection);
    // "weather·tempSection을 모르는 옛 클라이언트"의 push 모사: incoming data에 두 키가 없다.
    const oldData = readProject(docW);
    delete oldData.weather; delete oldData.tempSection;
    const shadow = clone(oldData);
    oldData.toolTitle = '옛클라 편집';                                    // 옛 클라가 다른 걸 편집
    reconcile(docW, oldData, shadow, 'app');
    const after = readProject(docW);
    ok('보호 키 weather는 삭제되지 않음', !!(after.weather && after.weather.rows && after.weather.rows.length===1 && after.weather.rows[0][0]==='맑음'));
    // 삭제는 "기준(shadow)엔 있었는데 내가 없앤 키"만 — 모르는 키(옛 클라·아직 반영 안 된 원격 추가)는 보호 키가 아니어도 보존
    ok('모르는 비보호 키 tempSection도 삭제되지 않음', !!after.tempSection);
    ok('옛 클라의 다른 편집(제목)은 정상 반영', after.toolTitle === '옛클라 편집');
    const mine = readProject(docW); const mineShadow = clone(mine);
    delete mine.tempSection;                                               // 내가 직접 지운 키
    reconcile(docW, mine, mineShadow, 'app');
    ok('내가 지운 최상위 키는 삭제됨', !('tempSection' in readProject(docW)));
  }

  // ---- 7. 줄바꿈(CR) 정규화: CR이 공유 문서에 들어가거나 편집 반복으로 쌓이지 않아야 한다 ----
  //  (회귀 방지: 엑셀 등에서 온 "\r\n"이 textarea(항상 LF)와 어긋나고 왕복마다 "\r\r\r\r\r\n"으로 쌓였다)
  {
    const hasCR = (x) => JSON.stringify(x).indexOf('\\r') !== -1;
    const lfCount = (s) => (String(s).match(/\n/g) || []).length;
    ok('normalizeLineBreaks: CRLF→LF', normalizeLineBreaks('a\r\nb') === 'a\nb');
    ok('normalizeLineBreaks: LF 앞 CR 묶음→줄바꿈 하나', normalizeLineBreaks('완료.\r\r\r\r\r\n다른\r\r\r\r\n▶') === '완료.\n다른\n▶');
    ok('normalizeLineBreaks: 홀로 남은 CR→LF', normalizeLineBreaks('a\rb') === 'a\nb');
    ok('normalizeLineBreaks: LF 빈 줄은 보존', normalizeLineBreaks('a\n\nb') === 'a\n\nb');
    ok('normalizeLineBreaks: 문자열 아닌 값은 그대로', normalizeLineBreaks(null) === null && normalizeLineBreaks(3) === 3);

    // (a) CRLF 시드로 빌드 → 공유 문서 어디에도 CR 없음(텍스트 칸·평범한 칸·아이템 설명)
    const crSeed = sampleData();
    crSeed.sheet1.rows[0][SCRIPT_COL] = '완료.\r\n다른 구역으로 이동한다.\r\n\r\n▶[지역/종탑]';
    crSeed.sheet1.rows[0][2] = '본당\r\n';
    crSeed.items.SWORD.desc = '낡은\r\n검';
    const docC = new Y.Doc();
    buildProject(docC, clone(crSeed), 'init');
    const rc = readProject(docC);
    ok('CRLF 시드 빌드: 공유 문서에 CR 없음', !hasCR(rc));
    ok('CRLF 시드 빌드: 줄 구조는 LF로 보존', rc.sheet1.rows[0][SCRIPT_COL] === '완료.\n다른 구역으로 이동한다.\n\n▶[지역/종탑]');

    // (b) 재조정으로 CR 값이 들어와도 Y는 LF, data도 제자리 정규화 → shadow(=clone(data))가 Y와 일치
    const cur = readProject(docC); const sh = clone(cur);
    cur.sheet1.rows[1][SCRIPT_COL] = '나선\r\n계단\r\r\n입구.';
    reconcile(docC, cur, sh, 'app');
    ok('reconcile: CR 입력이 Y에 LF로 저장', readProject(docC).sheet1.rows[1][SCRIPT_COL] === '나선\n계단\n입구.');
    ok('reconcile: data도 정규화되어 Y와 일치', JSON.stringify(cur) === JSON.stringify(readProject(docC)));

    // (c) 이미 CR이 박힌 문서(과거 데이터·옛 클라이언트) 복구: 두 클라이언트 동시 복구도 같은 결과
    const docR = new Y.Doc();
    buildProject(docR, clone(sampleData()), 'init');
    const tR = docR.getMap('project').get('sheet1').get('rows').get(0).get(SCRIPT_COL);
    docR.transact(() => { tR.delete(0, tR.length); tR.insert(0, '완료.\r\r\r\r\r\n다른.\r\r\r\r\r\n\r\r\r\r\n▶[지역/X]'); }, 'legacy');
    const docR2 = new Y.Doc(); Y.applyUpdate(docR2, Y.encodeStateAsUpdate(docR));
    const svR1 = Y.encodeStateVector(docR), svR2 = Y.encodeStateVector(docR2);
    const nFixed = repairTextLineBreaks(docR, 'app');
    repairTextLineBreaks(docR2, 'app');
    Y.applyUpdate(docR, Y.encodeStateAsUpdate(docR2, svR1), 'remote');
    Y.applyUpdate(docR2, Y.encodeStateAsUpdate(docR, svR2), 'remote');
    const fixed = readProject(docR).sheet1.rows[0][SCRIPT_COL];
    log('  복구 결과: ' + JSON.stringify(fixed));
    ok('repair: 쌓인 CR 제거, 줄 구조 보존', fixed === '완료.\n다른.\n\n▶[지역/X]');
    ok('repair: 동시 복구 후 A===B', JSON.stringify(readProject(docR)) === JSON.stringify(readProject(docR2)));
    ok('repair: 복구 개수 반환, 재실행은 no-op', nFixed === 1 && repairTextLineBreaks(docR, 'app') === 0);
    const docL = new Y.Doc();
    buildProject(docL, clone(sampleData()), 'init');
    const tL = docL.getMap('project').get('sheet1').get('rows').get(1).get(SCRIPT_COL);
    docL.transact(() => { tL.insert(tL.length, '\r끝'); }, 'legacy');
    repairTextLineBreaks(docL, 'app');
    ok('repair: 홀로 남은 CR은 LF로', readProject(docL).sheet1.rows[1][SCRIPT_COL] === '나선계단 입구.\n끝');

    // (d) CR 칸을 textarea처럼 반복 편집(원문 prev → 브라우저가 LF로 정규화한 값) + 재조정 → CR·줄 수가 늘지 않음
    const docE = new Y.Doc();
    buildProject(docE, clone(sampleData()), 'init');
    const tE = docE.getMap('project').get('sheet1').get('rows').get(0).get(SCRIPT_COL);
    docE.transact(() => { tE.delete(0, tE.length); tE.insert(0, '완료.\r\n다른 구역으로 이동한다.\r\n\r\n▶[지역/종탑]'); }, 'legacy');
    const lf0 = lfCount(normalizeLineBreaks(tE.toString()));
    let good = true;
    for (let i = 0; i < 5; i++) {
      const prev = tE.toString();                              // Y 원문(CR이 남아 있을 수 있음)
      const taVal = normalizeLineBreaks(prev).replace(/^완료\d*\./, '완료' + i + '.'); // textarea 값(LF) + 편집
      applyTextDiff(tE, prev, taVal);
      if (tE.toString() !== taVal) good = false;
      const dE = readProject(docE); const sE = clone(dE);
      dE.sheet1.rows[0][2] = '본당' + i;                       // 같은 행 다른 칸 편집 → 행 재조정
      reconcile(docE, dE, sE, 'app');
    }
    const finalE = tE.toString();
    ok('반복 편집: 매번 Y===textarea 값', good);
    ok('반복 편집: CR 0개', finalE.indexOf('\r') === -1);
    ok('반복 편집: 줄바꿈 수 유지(빈 줄 증식 없음)', lfCount(finalE) === lf0);
  }

  // ---- 8. 3-way 텍스트 병합: 기준(shadow)보다 Y가 앞서 있어도(아직 앱에 반영 안 된 원격 편집)
  //         원격 편집을 되돌리거나 내 편집을 두 번 넣지 않는다 ----
  {
    const mkT = (s) => { const d = new Y.Doc(); const t = d.getText('t'); t.insert(0, s); return t; };
    let t = mkT('abc REMOTE def');                       // 기준 'abc def' 이후 원격이 ' REMOTE' 삽입
    applyTextDiff(t, 'abc def', 'abc def LOCAL');
    ok('3-way: 뒤쪽 내 편집 + 앞쪽 원격 편집 둘 다', t.toString() === 'abc REMOTE def LOCAL');
    t = mkT('abc def REMOTE');
    applyTextDiff(t, 'abc def', 'LOCAL abc def');
    ok('3-way: 앞쪽 내 편집 + 뒤쪽 원격 편집 둘 다', t.toString() === 'LOCAL abc def REMOTE');
    t = mkT('abc def LOCAL');
    applyTextDiff(t, 'abc def', 'abc def LOCAL');
    ok('3-way: 이미 반영된 내 편집은 다시 넣지 않음', t.toString() === 'abc def LOCAL');
    t = mkT('abc XYZ def ghi');                          // 같은 구간을 원격도 고침
    applyTextDiff(t, 'abc 123 def ghi', 'abc 456 def ghi');
    ok('3-way: 같은 구간 충돌 → 그 구간만 내 값(나머지 그대로)', t.toString() === 'abc 456 def ghi');

    // 기준을 모르는 칸(기준 행이 짧은 sparse 행 등)은 덮어쓰기 — 예전엔 빈 기준으로 Y 글 앞에 한 번 더 붙었다
    const docU = new Y.Doc();
    buildProject(docU, clone(sampleData()), 'init');
    const dU = readProject(docU); const sU = clone(dU);
    sU.sheet1.rows[0] = sU.sheet1.rows[0].slice(0, SCRIPT_COL);   // 기준 행에 그 칸 정보 없음
    dU.sheet1.rows[0][SCRIPT_COL] = '거대한 아치 천장. 먼지.';
    reconcile(docU, dU, sU, 'app');
    ok('기준 모르는 텍스트 칸: 중복 없이 새 값', readProject(docU).sheet1.rows[0][SCRIPT_COL] === '거대한 아치 천장. 먼지.');
  }

  log('\n=== ' + pass + ' passed, ' + fail + ' failed ===', fail ? 'fail' : 'pass');
  document.title = fail === 0 ? 'BRIDGE OK' : 'BRIDGE FAIL';
} catch (e) {
  log('ERROR: ' + (e && e.stack || e), 'fail');
  document.title = 'BRIDGE ERROR';
}
</script>
